name: Refresh open-source contribution cards

on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/contributions.yml'

permissions:
  contents: write

concurrency:
  group: contribution-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test generator
        run: python -m unittest discover -s scripts -v
      - name: Refresh from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/contributions.py
      - name: Commit changed cards and contribution links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/open-source-*.svg data/contributions.json README.md
          if git diff --cached --quiet; then
            echo "Contribution cards are already current."
          else
            git commit -m "Refresh open-source contribution cards"
            git push
          fi
